<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FairRide - Driver Dispatch</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- PeerJS WebRTC Relay -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <link rel="stylesheet" href="../Riders/style.css">

  <style>
    .driver-tag {
      background: #2563eb;
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    #incoming-request-card {
      display: none;
      background: #222;
      border: 2px solid #10b981;
      border-radius: 14px;
      padding: 14px;
      margin-top: 12px;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from {
        border-color: #10b981;
        box-shadow: 0 0 5px rgba(16, 185, 129, 0.3);
      }
      to {
        border-color: #34d399;
        box-shadow: 0 0 16px rgba(16, 185, 129, 0.6);
      }
    }

    .btn-accept {
      background: #10b981;
      color: #000;
      font-weight: 700;
      padding: 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      font-size: 15px;
    }

    .btn-decline {
      background: #3f3f46;
      color: #fff;
      padding: 9px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      width: 100%;
      margin-top: 6px;
      font-size: 13px;
    }

    .driver-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-gps-driver {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #10b981;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="ride-panel">
    <div class="header-bar">
      <div>
        <h3 id="driver-display-name">Driver Portal</h3>
        <span class="driver-tag">0% Commission Partner</span>
      </div>
      <div class="driver-actions">
        <button class="btn-gps-driver" id="driver-gps-btn" onclick="locateDriver()">GPS</button>
        <button onclick="driverLogout()" style="background: none; border: none; color: #ef4444; font-size: 13px; cursor: pointer;">Log Out</button>
      </div>
    </div>

    <div id="waiting-status" style="padding: 12px 0; color: #a1a1aa; font-size: 13px; text-align: center;">
      <span id="gps-status-text">Connecting to dispatch server...</span>
    </div>

    <div id="incoming-request-card">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span style="font-weight: 700; color: #10b981; font-size: 16px;">New Ride Request!</span>
        <span id="offer-payout" style="font-size: 20px; font-weight: 800; color: #fff;">$0.00</span>
      </div>

      <div style="font-size: 13px; margin: 10px 0; color: #ddd; display: flex; flex-direction: column; gap: 4px;">
        <div><strong>From:</strong> <span id="offer-pickup">-</span></div>
        <div><strong>To:</strong> <span id="offer-dropoff">-</span></div>
        <div style="color: #a1a1aa; font-size: 12px; margin-top: 4px;" id="offer-stats">-</div>
      </div>

      <button class="btn-accept" onclick="acceptRide()">Accept Job (Keep 100%)</button>
      <button class="btn-decline" onclick="declineRide()">Pass</button>
    </div>
  </div>

  <script src="driver.js"></script>
</body>
</html>
